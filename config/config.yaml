hydra:
  run:
    dir: .

RESUME: false
CHECKPOINT: null

INFERENCE:
  IMAGE_PATH: null
  LABEL: null

CP:
  ALPHA: 0.1
  CALIB_SIZE: 1000

DATALOADER:
  NUM_WORKERS: 2 # to work with colab

DATASET:
  DIR: data

INPUT:
  MAX_SCALE_TRAIN: 1.2
  MIN_SCALE_TRAIN: 0.5
  PIXEL_MEAN:
    - 0.4914
    - 0.4822
    - 0.4465
  PIXEL_STD:
    - 0.2470
    - 0.2435
    - 0.2616
  PROB: 0.5
  SIZE_TEST: 32
  SIZE_TRAIN: 32

MODEL:
  DEVICE: cuda
  NAME: ResNet32
  NUM_CLASSES: 10


SOLVER:
  BASE_LR: 0.1
  BIAS_LR_FACTOR: 2
  CHECKPOINT_PERIOD: 10
  EARLY_STOPPING_PATIENCE: 30
  GAMMA: 0.1
  IMS_PER_BATCH: 16
  LOG_PERIOD: 100
  MAX_EPOCHS: 500
  MOMENTUM: 0.9
  OPTIMIZER_NAME: SGD
  STEPS: [200, 350]
  WARMUP_FACTOR: 0.3333333333333333
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.0001
  WEIGHT_DECAY_BIAS: 0

TEST:
  IMS_PER_BATCH: 8
  